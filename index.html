<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo de Integridade Documental - Registo de Banco</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-custom-gradient {
            background: linear-gradient(180deg, #0d72c4 0%, #188a87 50%, #269a57 100%);
        }
    </style>
</head>
<body class="bg-custom-gradient min-h-screen flex items-center justify-center p-4 sm:p-6 text-slate-800 font-sans">

    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-white/20 p-6 sm:p-8 w-full max-w-lg my-8">
        
        <!-- Cabeçalho -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-[#2e7df6] flex items-center justify-center text-white shadow-md shadow-blue-500/20 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">Registar Instituição</h1>
                    <p class="text-xs text-slate-500 font-medium">Consórcio Blockchain PFC</p>
                </div>
            </div>

            <!-- Botão de Auto-preenchimento via API -->
            <button type="button" onclick="generateCredentialsFromAPI()" 
                class="bg-blue-50 hover:bg-blue-100 text-[#0d72c4] border border-blue-200 text-xs font-bold px-3 py-2 rounded-xl transition active:scale-95 flex items-center gap-1.5 shadow-sm">
                <span>🔑 Gerar Credenciais</span>
            </button>
        </div>

        <!-- Formulário -->
        <form id="registerBankForm" class="space-y-4">

            <!-- ID do Banco -->
            <div>
                <label for="bankId" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                    ID do Banco (bankId)
                </label>
                <input type="number" id="bankId" name="bankId" required placeholder="Ex: 101"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#2e7df6] focus:bg-white transition placeholder:text-slate-400">
            </div>

            <!-- Nome do Banco -->
            <div>
                <label for="name" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                    Nome da Instituição
                </label>
                <input type="text" id="name" name="name" required placeholder="Ex: Millennium bim / BCI"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#2e7df6] focus:bg-white transition placeholder:text-slate-400">
            </div>

            <!-- Chave Mestre (Management Key) -->
            <div>
                <label for="managementKey" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                    Chave Mestre (Management Key)
                </label>
                <input type="text" id="managementKey" name="managementKey" required placeholder="0x..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-mono text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#2e7df6] focus:bg-white transition placeholder:text-slate-400">
                <span class="text-[11px] text-slate-400 mt-1 block">Endereço de cofre para gestão administrativa.</span>
            </div>

            <!-- Chave Operacional (Operational Address) -->
            <div>
                <label for="operationalKey" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                    Chave Operacional (Endereço Público)
                </label>
                <input type="text" id="operationalKey" name="operationalKey" required placeholder="0x..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-mono text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#2e7df6] focus:bg-white transition placeholder:text-slate-400">
                <span class="text-[11px] text-slate-400 mt-1 block">Endereço que ficará registado no contrato BankRegistry.</span>
            </div>

            <!-- Cartão Alerta da Chave Privada Gerada (Apenas para o utilizador guardar) -->
            <div id="privateKeyCard" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 transition-all">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-bold text-amber-800 uppercase tracking-wider flex items-center gap-1">
                        ⚠️ Chave Privada Operacional (Guarde para o Core)
                    </span>
                    <button type="button" onclick="copyPrivateKey()" class="text-[11px] bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold px-2 py-1 rounded-md transition">
                        📋 Copiar
                    </button>
                </div>
                <input type="text" id="generatedPrivateKey" readonly 
                    class="w-full bg-amber-100/60 border border-amber-300 rounded-lg px-3 py-2 text-xs font-mono text-amber-900 focus:outline-none select-all">
                <span class="text-[10px] text-amber-700 mt-1 block">Esta chave privada será usada no simulator do Core Bancário para assinar extratos.</span>
            </div>

            <!-- Duração em Segundos -->
            <div>
                <label for="durationInSeconds" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">
                    Validade da Licença (Segundos)
                </label>
                <div class="flex gap-2">
                    <input type="number" id="durationInSeconds" name="durationInSeconds" required placeholder="31536000"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-mono text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#2e7df6] focus:bg-white transition placeholder:text-slate-400">
                    <button type="button" onclick="setOneYear()" 
                        class="bg-slate-100 hover:bg-slate-200 text-[#0d72c4] font-bold text-xs px-4 py-3 rounded-xl transition whitespace-nowrap active:scale-95">
                        + 1 Ano
                    </button>
                </div>
            </div>

            <!-- Botão Submeter -->
            <button type="submit" id="submitBtn"
                class="w-full bg-[#2e7df6] hover:bg-[#1a6ce8] text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 mt-6 active:scale-[0.99]">
                <span id="btnText">Registar na Blockchain</span>
                <span id="btnSpinner" class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
            </button>
        </form>

        <!-- Resultado / Feedback -->
        <div id="responseBox" class="mt-6 p-4 rounded-2xl hidden text-xs font-mono break-all leading-relaxed shadow-inner"></div>
    </div>

    <script>
        const API_BASE_URL = 'https://api-blockchain-pfc-1021823144662.africa-south1.run.app';

        function setOneYear() {
            document.getElementById('durationInSeconds').value = 31536000;
        }

        // Chama o endpoint Spring Boot para obter novas credenciais
        async function generateCredentialsFromAPI() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/v1/admin/credentials/generate`);
                const data = await res.json();

                if (res.ok && data.address) {
                    const randomId = Math.floor(100 + Math.random() * 900);
                    document.getElementById('bankId').value = randomId;
                    document.getElementById('name').value = `Banco Comercial #${randomId}`;
                    
                    // Preenche o endereço público na operationalKey
                    document.getElementById('operationalKey').value = data.address;
                    
                    // Gera um endereço aleatório simples para a managementKey
                    document.getElementById('managementKey').value = '0x' + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
                    
                    // Exibe e preenche a Chave Privada no Cartão Alerta
                    document.getElementById('generatedPrivateKey').value = data.privateKey;
                    document.getElementById('privateKeyCard').classList.remove('hidden');

                    setOneYear();
                } else {
                    alert('Erro ao gerar credenciais na API: ' + (data.error || 'Desconhecido'));
                }
            } catch (err) {
                alert('Não foi possível conectar ao endpoint /api/v1/admin/credentials/generate');
            }
        }

        function copyPrivateKey() {
            const input = document.getElementById('generatedPrivateKey');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('Chave Privada copiada com sucesso!');
        }

        document.getElementById('registerBankForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const responseBox = document.getElementById('responseBox');

            submitBtn.disabled = true;
            btnText.textContent = 'A processar transação...';
            btnSpinner.classList.remove('hidden');
            responseBox.classList.add('hidden');

            const payload = {
                bankId: parseInt(document.getElementById('bankId').value, 10),
                name: document.getElementById('name').value.trim(),
                managementKey: document.getElementById('managementKey').value.trim(),
                operationalKey: document.getElementById('operationalKey').value.trim(),
                durationInSeconds: parseInt(document.getElementById('durationInSeconds').value, 10)
            };

            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/banks/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                responseBox.classList.remove('hidden');
                
                if (response.ok) {
                    responseBox.className = 'mt-6 p-4 rounded-2xl text-xs font-mono break-all bg-emerald-50 border border-emerald-200 text-emerald-800';
                    responseBox.innerHTML = `
                        <strong class="text-emerald-700 block mb-1 font-sans text-sm">✅ ${data.message}</strong>
                        <div class="mt-2 text-slate-600"><strong>Tx Hash:</strong></div>
                        <div class="text-emerald-900 font-bold mt-0.5">${data.transactionHash}</div>
                    `;
                } else {
                    responseBox.className = 'mt-6 p-4 rounded-2xl text-xs font-mono break-all bg-rose-50 border border-rose-200 text-rose-800';
                    responseBox.innerHTML = `<strong class="text-rose-700 block mb-1 font-sans text-sm">❌ Erro no Registo</strong> ${data.error || 'Erro desconhecido.'}`;
                }
            } catch (err) {
                responseBox.classList.remove('hidden');
                responseBox.className = 'mt-6 p-4 rounded-2xl text-xs font-mono break-all bg-amber-50 border border-amber-200 text-amber-800';
                responseBox.innerHTML = `<strong class="text-amber-700 block mb-1 font-sans text-sm">⚠️ Falha de Conexão</strong> Erro na comunicação com o Cloud Run.`;
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Registar na Blockchain';
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
